<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quest | charity: water</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Confetti Library for Win Celebration LevelUp -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="game-wrapper">
        <!-- Official Brand Logo Lockup Placement (Negative Space / High Legibility) -->
        <header>
            <div class="brand-logo">
                <span class="jerry-can-icon">🪣</span> 
                <span class="logo-text">charity: water</span>
            </div>
            <h1>Water Quest</h1>
            <p>Provide clean water. Avoid contaminated sources.</p>
        </header>

        <div class="scoreboard">
            <div class="stat-box">Score: <span id="score-val">0</span> / 15</div>
            <div class="stat-box">Time: <span id="timer-val">30</span>s</div>
        </div>

        <!-- Game Play Area -->
        <div id="game-container">
            <div id="start-screen" class="overlay-screen">
                <h2>READY TO PLAY?</h2>
                <button id="start-btn" class="brand-btn">START MISSION</button>
            </div>
            
            <div id="game-over-screen" class="overlay-screen hidden">
                <h2 id="end-title">MISSION COMPLETE</h2>
                <p id="end-message">Final Score: <span id="final-score">0</span></p>
                <button id="reset-btn" class="brand-btn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
